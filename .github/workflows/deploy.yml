name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 调试当前路径
      - name: Debug paths and files
        run: |
          echo "Current working directory:"
          pwd

          echo "File existence check for package-lock.json:"
          ls -lah package-lock.json || echo "File not found!"

      # 配置 Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # 修改为正确的工作目录执行 npm install
      - name: Install dependencies
        run: npm install
#        working-directory: ./vue3-ios-project

      - name: Build project
        run: npm run build
#        working-directory: ./vue3-ios-project

#      - name: 修复静态资源路径
#        run: |
#          sed -i 's/src="\//src="\/factory_ERP_demo\/vue3-ios-project\//g' ./vue3-ios-project/dist/index.html
#          sed -i 's/href="\//href="\/factory_ERP_demo\/vue3-ios-project\//g' ./vue3-ios-project/dist/index.html


      - name: Verify build output
        run: |
          echo "=== BUILD OUTPUT ==="
          pwd
          cat dist/index.html | grep base
          echo "\n=== PATH CHECK ==="
          echo "Base path in config: $(grep -A 1 'base:' vite.config.js)"
          echo "Publish dir: $(pwd)/dist"

      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
